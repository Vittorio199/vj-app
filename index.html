<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VJ" />
  <title>VJ — Noi</title>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #18181f;
      --card-border: #272732;
      --text: #f4f4f6;
      --muted: #9898a6;
      --accent: #ff4d6d;
      --accent-soft: rgba(255, 77, 109, 0.15);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top, 16px) 16px 32px;
      max-width: 500px;
      margin-inline: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px 18px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-badge {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .counter-grid {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .days-big {
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
    }

    .days-label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .next-milestone {
      text-align: right;
      background: var(--accent-soft);
      padding: 10px 14px;
      border-radius: 14px;
    }

    .next-milestone strong {
      display: block;
      font-size: 16px;
      color: #ff8fa3;
    }

    .next-milestone span {
      font-size: 11px;
      color: var(--muted);
    }

    .section-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 700;
    }

    .q-controls {
      display: flex;
      gap: 6px;
    }

    select, .btn-small {
      background: #22222c;
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .question-text {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      margin: 6px 0 16px;
    }

    .answer-box {
      background: #121218;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .answer-author {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .answer-content {
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }

    .blurred {
      filter: blur(6px);
      user-select: none;
      opacity: 0.7;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input[type="text"] {
      flex: 1;
      background: #121218;
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      touch-action: none;
      border: 2px solid var(--card-border);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .colors {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-dot.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    .stickers {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      justify-content: space-between;
    }

    .sticker-btn {
      flex: 1;
      background: #22222c;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 0;
      font-size: 18px;
      cursor: pointer;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
      padding: 20px;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .modal h3 {
      margin-top: 0;
    }

    .role-btns {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .role-btns button {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: #22222c;
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">V &amp; J</div>
    <button class="user-badge" id="userBadge" onclick="openRoleModal()">Profilo: ...</button>
  </header>

  <!-- CONTATORE -->
  <div class="card">
    <div class="counter-grid">
      <div>
        <div class="days-big" id="daysCount">0</div>
        <div class="days-label">giorni dal 4 Nov 2026</div>
      </div>
      <div class="next-milestone">
        <strong id="nextCountdown">-</strong>
        <span id="nextLabel">prossimo mesiversario</span>
      </div>
    </div>
  </div>

  <!-- DOMANDE -->
  <div class="card">
    <div class="section-top">
      <span class="section-title" id="qCounterLabel">Domanda (1/200)</span>
      <div class="q-controls">
        <select id="categorySelect" onchange="pickNewQuestion()">
          <option value="all">Tutte (200)</option>
          <option value="profonde">Profonde (50)</option>
          <option value="divertenti">Divertenti (50)</option>
          <option value="ricordi">Ricordi (50)</option>
          <option value="intime">Intime (50)</option>
        </select>
        <button class="btn-small" onclick="pickNewQuestion()">↻ Cambia</button>
      </div>
    </div>

    <div class="question-text" id="questionText">Caricamento...</div>

    <div class="answer-box">
      <div class="answer-author"><span>V</span><span id="statusV"></span></div>
      <div class="answer-content" id="answerV">In attesa di risposta...</div>
    </div>

    <div class="answer-box">
      <div class="answer-author"><span>J</span><span id="statusJ"></span></div>
      <div class="answer-content" id="answerJ">In attesa di risposta...</div>
    </div>

    <div class="input-row">
      <input type="text" id="answerInput" placeholder="Scrivi la tua risposta..." />
      <button class="btn-primary" onclick="submitAnswer()">Invia</button>
    </div>
  </div>

  <!-- LAVAGNA CONDIVISA -->
  <div class="card">
    <div class="section-top">
      <span class="section-title">Lavagna condivisa</span>
      <div>
        <button class="btn-small" onclick="saveCanvas()">Salva foto</button>
        <button class="btn-small" onclick="clearCanvas(true)">Pulisci</button>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="board" width="600" height="600"></canvas>
    </div>

    <div class="toolbar">
      <div class="colors" id="colorPalette">
        <div class="color-dot active" style="background:#111111" data-color="#111111"></div>
        <div class="color-dot" style="background:#ff4d6d" data-color="#ff4d6d"></div>
        <div class="color-dot" style="background:#3a86ff" data-color="#3a86ff"></div>
        <div class="color-dot" style="background:#2ec4b6" data-color="#2ec4b6"></div>
        <div class="color-dot" style="background:#ffbe0b" data-color="#ffbe0b"></div>
        <div class="color-dot" style="background:#8338ec" data-color="#8338ec"></div>
        <button class="btn-small" id="eraserBtn" onclick="toggleEraser()">Gomma</button>
      </div>
      <select id="brushSize">
        <option value="4">Fine</option>
        <option value="8" selected>Medio</option>
        <option value="16">Spesso</option>
      </select>
    </div>

    <div class="stickers">
      <button class="sticker-btn" onclick="addSticker('❤️')">❤️</button>
      <button class="sticker-btn" onclick="addSticker('🔥')">🔥</button>
      <button class="sticker-btn" onclick="addSticker('😘')">😘</button>
      <button class="sticker-btn" onclick="addSticker('🥺')">🥺</button>
      <button class="sticker-btn" onclick="addSticker('✨')">✨</button>
      <button class="sticker-btn" onclick="addSticker('🍕')">🍕</button>
    </div>
  </div>

  <!-- SELEZIONE PROFILO -->
  <div class="modal-backdrop" id="roleModal">
    <div class="modal">
      <h3>Chi sta usando l'app?</h3>
      <p style="color:var(--muted); font-size:14px;">Serve per sapere quali risposte sono tue e quali sono sbloccate.</p>
      <div class="role-btns">
        <button onclick="setRole('V')">Sono V</button>
        <button onclick="setRole('J')">Sono J</button>
      </div>
    </div>
  </div>

  <script type="module">

    const firebaseConfig = {
      apiKey: "AIzaSyC5Pz0iUFQ-n2wrLCCt8y8W4W5ePkd2hRk",
      authDomain: "tethered-vj.firebaseapp.com",
      projectId: "tethered-vj",
      storageBucket: "tethered-vj.firebasestorage.app",
      messagingSenderId: "470112267033",
      appId: "1:470112267033:web:a6416d339a5f12ed1a7388"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const coupleRef = doc(db, "couple", "vj_room");

    // --- 1. CONTATORE DAL 4/11/2026 ---
    const startDate = new Date(2026, 10, 4);
    function updateCounter() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
      document.getElementById("daysCount").textContent = diffDays >= 0 ? diffDays : 0;

      let nextMonth4 = new Date(today.getFullYear(), today.getMonth(), 4);
      if (today >= nextMonth4) {
        nextMonth4 = new Date(today.getFullYear(), today.getMonth() + 1, 4);
      }
      const daysToNext = Math.ceil((nextMonth4 - today) / (1000 * 60 * 60 * 24));
      document.getElementById("nextCountdown").textContent = daysToNext === 0 ? "Oggi! 🎉" : `tra ${daysToNext}g`;
    }
    updateCounter();

    // --- 2. PROFILO UTENTE ---
    let currentRole = localStorage.getItem("vj_role");
    window.openRoleModal = () => document.getElementById("roleModal").style.display = "flex";
    window.setRole = (role) => {
      currentRole = role;
      localStorage.setItem("vj_role", role);
      document.getElementById("userBadge").textContent = `Profilo: ${role}`;
      document.getElementById("roleModal").style.display = "none";
      if (lastState) renderState(lastState);
    };
    if (!currentRole) openRoleModal();
    else document.getElementById("userBadge").textContent = `Profilo: ${currentRole}`;

    // --- 3. DATABASE 200 DOMANDE ---

    let lastState = null;

    window.pickNewQuestion = async () => {
      const cat = document.getElementById("categorySelect").value;
      const pool = cat === "all" ? QUESTIONS : QUESTIONS.filter(q => q.cat === cat);
      const seen = lastState?.seenQuestions || [];
      
      // Filtra domande non ancora viste in questa categoria
      let unseen = pool.filter(q => !seen.includes(q.text));
      let resetSeen = false;

      if (unseen.length === 0) {
        unseen = pool;
        resetSeen = true;
      }

      const currentQ = lastState?.question || "";
      let next = unseen[Math.floor(Math.random() * unseen.length)];
      if (unseen.length > 1 && next.text === currentQ) {
        next = unseen[(unseen.indexOf(next) + 1) % unseen.length];
      }

      const updatedSeen = resetSeen ? [next.text] : [...new Set([...seen, next.text])];

      await setDoc(coupleRef, {
        question: next.text,
        answerV: "",
        answerJ: "",
        seenQuestions: updatedSeen
      }, { merge: true });
    };

    window.submitAnswer = async () => {
      if (!currentRole) return openRoleModal();
      const input = document.getElementById("answerInput");
      const val = input.value.trim();
      if (!val) return;
      const field = currentRole === "V" ? "answerV" : "answerJ";
      await setDoc(coupleRef, { [field]: val }, { merge: true });
      input.value = "";
    };

    // --- 4. LAVAGNA CONDIVISA ---
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    let drawing = false;
    let currentColor = "#111111";
    let eraser = false;
    let saveTimer = null;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    document.querySelectorAll(".color-dot").forEach(dot => {
      dot.addEventListener("click", () => {
        eraser = false;
        document.getElementById("eraserBtn").style.borderColor = "var(--card-border)";
        document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
        dot.classList.add("active");
        currentColor = dot.dataset.color;
      });
    });

    window.toggleEraser = () => {
      eraser = !eraser;
      document.getElementById("eraserBtn").style.borderColor = eraser ? "var(--accent)" : "var(--card-border)";
    };

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startDraw(e) {
      drawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function moveDraw(e) {
      if (!drawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineWidth = eraser ? 26 : Number(document.getElementById("brushSize").value);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = eraser ? "#ffffff" : currentColor;
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function endDraw() {
      if (!drawing) return;
      drawing = false;
      scheduleSync();
    }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", moveDraw);
    window.addEventListener("mouseup", endDraw);

    canvas.addEventListener("touchstart", startDraw, { passive: false });
    canvas.addEventListener("touchmove", moveDraw, { passive: false });
    canvas.addEventListener("touchend", endDraw);

    window.addSticker = (emoji) => {
      ctx.font = "64px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const x = 150 + Math.random() * 300;
      const y = 150 + Math.random() * 300;
      ctx.fillText(emoji, x, y);
      scheduleSync();
    };

    window.clearCanvas = (sync = true) => {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (sync) scheduleSync();
    };

    window.saveCanvas = () => {
      const link = document.createElement("a");
      link.download = `VJ-lavagna-${Date.now()}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    };

    function scheduleSync() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        const dataUrl = canvas.toDataURL("image/jpeg", 0.65);
        await setDoc(coupleRef, {
          canvasData: dataUrl,
          updatedBy: currentRole || "unknown",
          updatedAt: Date.now()
        }, { merge: true });
      }, 450);
    }

    // --- 5. SINCRONIZZAZIONE REALTIME ---
    function renderState(data) {
      const qText = data.question || QUESTIONS[0].text;
      document.getElementById("questionText").textContent = qText;

      const idx = QUESTIONS.findIndex(q => q.text === qText);
      const seenCount = (data.seenQuestions || []).length || 1;
      document.getElementById("qCounterLabel").textContent = `Domanda (${seenCount}/${QUESTIONS.length})`;

      const aV = data.answerV || "";
      const aJ = data.answerJ || "";
      const bothAnswered = aV.length > 0 && aJ.length > 0;

      const elV = document.getElementById("answerV");
      const elJ = document.getElementById("answerJ");

      if (!aV) {
        elV.textContent = "In attesa di risposta...";
        elV.classList.remove("blurred");
        document.getElementById("statusV").textContent = "";
      } else if (currentRole === "V" || bothAnswered) {
        elV.textContent = aV;
        elV.classList.remove("blurred");
        document.getElementById("statusV").textContent = "✓";
      } else {
        elV.textContent = "Risposta nascosta — rispondi per sbloccare";
        elV.classList.add("blurred");
        document.getElementById("statusV").textContent = "Pronta 🔒";
      }

      if (!aJ) {
        elJ.textContent = "In attesa di risposta...";
        elJ.classList.remove("blurred");
        document.getElementById("statusJ").textContent = "";
      } else if (currentRole === "J" || bothAnswered) {
        elJ.textContent = aJ;
        elJ.classList.remove("blurred");
        document.getElementById("statusJ").textContent = "✓";
      } else {
        elJ.textContent = "Risposta nascosta — rispondi per sbloccare";
        elJ.classList.add("blurred");
        document.getElementById("statusJ").textContent = "Pronta 🔒";
      }

      if (data.canvasData && !drawing) {
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = data.canvasData;
      }
    }

    onSnapshot(coupleRef, async (snap) => {
      if (!snap.exists()) {
        await setDoc(coupleRef, {
          question: QUESTIONS[0].text,
          answerV: "",
          answerJ: "",
          seenQuestions: [QUESTIONS[0].text]
        });
        return;
      }
      lastState = snap.data();
      renderState(lastState);
    });
  </script>
