<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VJ" />
  <title>VJ — Noi</title>
  <link id="appleIcon" rel="apple-touch-icon" sizes="180x180" />
  <script>
    (function() {
      const c = document.createElement("canvas");
      c.width = 180;
      c.height = 180;
      const x = c.getContext("2d");
      x.fillStyle = "#0f0f13";
      x.fillRect(0, 0, 180, 180);
      const g = x.createLinearGradient(0, 0, 180, 180);
      g.addColorStop(0, "#ff4d6d");
      g.addColorStop(1, "#ff8fa3");
      x.fillStyle = g;
      x.font = "800 54px -apple-system, BlinkMacSystemFont, sans-serif";
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.fillText("V&J", 90, 94);
      document.getElementById("appleIcon").href = c.toDataURL("image/png");
    })();
  </script>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #18181f;
      --card-border: #272732;
      --text: #f4f4f6;
      --muted: #9898a6;
      --accent: #ff4d6d;
      --accent-soft: rgba(255, 77, 109, 0.15);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top, 16px) 16px 32px;
      max-width: 500px;
      margin-inline: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px 18px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-badge {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .counter-grid {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .days-big {
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
    }

    .days-label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .next-milestone {
      text-align: right;
      background: var(--accent-soft);
      padding: 10px 14px;
      border-radius: 14px;
    }

    .next-milestone strong {
      display: block;
      font-size: 16px;
      color: #ff8fa3;
    }

    .next-milestone span {
      font-size: 11px;
      color: var(--muted);
    }

    .section-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 700;
    }

    .q-controls {
      display: flex;
      gap: 6px;
    }

    select, .btn-small {
      background: #22222c;
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .question-text {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      margin: 6px 0 16px;
    }

    .answer-box {
      background: #121218;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .answer-author {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .answer-content {
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }

      filter: blur(6px);
      user-select: none;
      opacity: 0
